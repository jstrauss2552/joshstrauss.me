<!doctype html>
<!-- Render this page at 1200 x 630, device scale 1, to generate og.png. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Josh Strauss social share image</title>
  <style>
    @font-face { font-family: Hanken; src: url('../fonts/hanken-grotesk-var.woff2') format('woff2'); font-weight: 100 900; }
    @font-face { font-family: Newsreader; src: url('../fonts/newsreader-var.woff2') format('woff2'); font-weight: 400 700; }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { padding: 58px 66px; background: #f6f8fb; color: #152942; font-family: Hanken, Arial, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; font-size: 19px; }
    .mark { display: grid; place-items: center; width: 43px; height: 43px; border-radius: 50%; background: #152942; color: white; font-size: 17px; font-weight: 600; }
    header p { color: #56667a; }
    h1 { margin: 48px 0 25px -8px; font-size: 147px; line-height: 1; letter-spacing: -.075em; font-weight: 500; }
    .mission { max-width: 750px; font: 400 42px/1.15 Newsreader, Georgia, serif; letter-spacing: -.025em; }
    footer { position: absolute; bottom: 55px; left: 66px; right: 66px; display: flex; justify-content: space-between; font-size: 19px; color: #56667a; }
  </style>
</head>
<body>
  <header><span class="mark">JS</span><p>Builder, founder &amp; UATX sophomore</p></header>
  <h1>Josh Strauss.</h1>
  <p class="mission">Building products and companies that leave people better off.</p>
  <footer><span>joshstrauss.me</span><span>Austin, TX / Miami, FL</span></footer>
</body>
</html>
